name: Update Hosts File

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Create hosts file if missing
        run: |
          set -euo pipefail

          if [ ! -f hosts.txt ]; then
            echo "Creating hosts.txt..."
            touch hosts.txt
          fi

      - name: Download hosts file
        run: |
          set -euo pipefail

          URL="https://schakal.ru/hosts/hosts.txt"

          MAX_ATTEMPTS=5
          DELAY=15

          echo "Starting download..."

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo ""
            echo "=============================="
            echo "Attempt $i of $MAX_ATTEMPTS"
            echo "=============================="

            if curl -4 -L \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 15 \
              --max-time 120 \
              --retry 0 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:138.0) Gecko/20100101 Firefox/138.0" \
              -o hosts.tmp \
              "$URL"
            then
              echo "Download completed"

              if [ ! -s hosts.tmp ]; then
                echo "Downloaded file is empty"
                rm -f hosts.tmp
                exit 1
              fi

              mv hosts.tmp hosts.txt

              echo "hosts.txt updated successfully"
              exit 0
            fi

            echo "Attempt $i failed"

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting ${DELAY}s before retry..."
              sleep "$DELAY"
            fi
          done

          echo "All download attempts failed"
          exit 1

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet hosts.txt; then
            echo "No changes detected"
            exit 0
          fi

          git add hosts.txt
          git commit -m "Auto-update hosts file"
          git push
